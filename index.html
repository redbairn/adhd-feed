<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADHD Focus Feed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🧠 ADHD Focus Stream</h1>
    
    <div class="toolbar">
        <input type="text" id="searchBar" class="search-bar" placeholder="Search articles...">
        <select id="filterDropdown" class="filter-dropdown">
            <option value="all">All Sources</option>
        </select>
    </div>

    <div id="feed" class="feed-container">Loading latest updates...</div>
</div>

<script>
    let allArticles = [];

    async function initFeed() {
        try {
            const response = await fetch('feed.json');
            allArticles = await response.json();
            
            populateFilterOptions(allArticles);
            renderArticles(allArticles);
            
            document.getElementById('searchBar').addEventListener('input', filterFeed);
            document.getElementById('filterDropdown').addEventListener('change', filterFeed);
        } catch (err) {
            document.getElementById('feed').innerText = "Failed to load feed data.";
        }
    }

    function populateFilterOptions(articles) {
        const dropdown = document.getElementById('filterDropdown');
        const sources = [...new Set(articles.map(a => a.source))];
        
        sources.forEach(source => {
            const opt = document.createElement('option');
            opt.value = source;
            opt.textContent = source;
            dropdown.appendChild(opt);
        });
    }

    function renderArticles(articles) {
        const container = document.getElementById('feed');
        container.innerHTML = '';
        
        if(articles.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#666;">No matching articles found.</div>';
            return;
        }

        articles.forEach(item => {
            const card = document.createElement('a');
            card.className = 'card';
            card.href = item.link;
            card.target = '_blank';
            
            card.innerHTML = `
                <h3>${item.title}</h3>
                <div class="meta-container">
                    <span class="source-badge">${item.source}</span>
                    <span class="author-badge">👤 ${item.author}</span>
                    <span class="date-badge">🕒 ${item.date}</span>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterFeed() {
        const searchInput = document.getElementById('searchBar').value.toLowerCase();
        const selectedSource = document.getElementById('filterDropdown').value;
        
        const filtered = allArticles.filter(article => {
            const matchesSearch = article.title.toLowerCase().includes(searchInput);
            const matchesSource = (selectedSource === 'all' || article.source === selectedSource);
            return matchesSearch && matchesSource;
        });
        
        renderArticles(filtered);
    }

    initFeed();
</script>
</body>
</html>
