name: Update ADHD Feed

on:
  schedule:
    - cron: '0 * * * *' # Triggers automatically every hour
  workflow_dispatch: # Allows you to manually click "Run workflow"

jobs:
  ping-pi:
    runs-on: ubuntu-latest
    steps:
      # This step does absolutely nothing except print a message to the logs.
      # Its real purpose is just existing so your Pi Python script detects a "queued" run!
      - name: Alerting Raspberry Pi 5 Hardware
        run: echo "Ping sent! The physical Pi 5 custom runner will now take over execution."